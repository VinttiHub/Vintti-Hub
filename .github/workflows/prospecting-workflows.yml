name: Prospecting workflows

# Motor de workflows del CRM de prospección (backend/prospecting/engine.py):
# inscribe por condición y por horario, cierra por meta / desinscripción y
# despierta las esperas vencidas ("esperar 3 días"). Lo que pasa al editar una
# empresa o al llegar de Clay ya corre al instante; esto cubre lo que depende
# del paso del tiempo.
#
# Cada hora porque las esperas pueden ser de horas y los horarios tienen hora.
# El atraso de GitHub (~4 h) sólo corre ese momento: la próxima corrida lo agarra.
#
# El schedule está APAGADO a propósito (fase de prueba con datos dummy, decisión
# de la owner). Aun prendido, mientras AUTOMATION_REAL_DATA = False en
# backend/prospecting/constants.py el cron sólo toca empresas dummy.
on:
  # schedule:
  #   - cron: "15 * * * *"
  workflow_dispatch:

jobs:
  tick:
    runs-on: ubuntu-latest
    steps:
      - name: Procesar workflows
        run: |
          curl -sS -X POST \
            --fail-with-body --retry 3 --retry-delay 15 \
            -H "Content-Type: application/json" \
            -H "X-Audit-Token: ${{ secrets.DASHBOARD_AUDIT_TOKEN }}" \
            -d "{}" \
            "https://7m6mw95m8y.us-east-2.awsapprunner.com/prospecting/workflows/tick"

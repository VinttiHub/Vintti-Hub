name: Daily data-entry digest

# Postea a Slack los pendientes de carga: pricing de hires, job descriptions y
# datos base de las opps, mencionando a cada duenio.
#
# Corre SINCRONICO y devuelve el resumen, asi que este job falla si el digest no
# pudo calcularse O si Slack rechazo el mensaje.
on:
  schedule:
    # Objetivo: que llegue ~09:00 Argentina. Argentina es UTC-3 FIJO (sin DST
    # desde 2009, ver dashboards/datasets/_now.py), asi que no hay que tocar
    # esto en octubre ni en marzo.
    #
    # 08:00 UTC serian las 05:00 ART, y NO es un error: el scheduler de GitHub
    # en este repo atrasa siempre. Medido el 2026-09-10 sobre 16 corridas reales
    # de "Daily reminders" (cron 12:00) y "Daily turbo sync" (cron 10:00):
    #     atraso minimo   2h27      (nunca fue cero)
    #     atraso mediano  3h58
    #     atraso maximo   9h40      (27 y 28 de agosto)
    # 08:00 + el atraso mediano cae 08:58 ART. El rango real va de 07:27 a
    # 14:40 ART: el cron de GitHub tiene 7 horas de dispersion y no puede
    # garantizar un horario. Si algun dia tiene que ser exacto, hay que mover el
    # disparo a un EventBridge Scheduler de AWS pegandole a este mismo endpoint
    # (preciso al minuto, pero vive fuera del repo) y sacar este bloque para no
    # postear dos veces.
    #
    # El minuto queda en 0 A PROPOSITO, aunque un minuto impar reduzca la cola:
    # las 16 mediciones son todas de jobs con minuto 0, asi que la compensacion
    # de 4h esta calibrada contra esa poblacion. Cambiar hora y minuto a la vez
    # invalida la calibracion: si el minuto impar funciona, el mensaje pasa a
    # llegar 05:30 ART. Un cambio por vez, y volver a medir.
    - cron: "0 8 * * 1-5"
  workflow_dispatch:
    inputs:
      dry:
        description: "1 = calcula y devuelve el preview, NO postea a Slack"
        required: false
        default: ""
      rule:
        description: "correr una sola regla: pricing | jd | base"
        required: false
        default: ""

jobs:
  digest:
    runs-on: ubuntu-latest
    steps:
      - name: Postear el digest
        run: |
          curl -sS -X POST \
            --fail-with-body --retry 3 --retry-delay 15 \
            -H "X-Audit-Token: ${{ secrets.DASHBOARD_AUDIT_TOKEN }}" \
            "https://7m6mw95m8y.us-east-2.awsapprunner.com/daily-digest/run?trigger=cron&dry=${{ github.event.inputs.dry }}&rule=${{ github.event.inputs.rule }}"

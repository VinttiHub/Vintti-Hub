<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Prospecting · Vintti Hub</title>
  <script src="./assets/js/auth-guard.js"></script>

  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="./assets/css/sidebar.css?v=20260908-aec2" />
  <link rel="stylesheet" href="./assets/css/prospecting.css?v=66" />
  <link rel="stylesheet" href="./assets/css/mobile.css?v=4">
</head>

<body class="light-mode">
  <div id="sidebarMount"></div>

  <main class="main-content page pr-page">
    <header class="pr-head">
      <div class="pr-head__main">
        <span class="pr-head__eyebrow"><i class="fa-solid fa-bullseye"></i> Prospecting</span>
        <!-- Menú de secciones (prospecting.js → showSection / sectionMenu) -->
        <h1 class="pr-head__title">
          <button type="button" class="pr-secbtn" id="prSectionBtn" aria-haspopup="menu">Empresas</button>
        </h1>
        <p class="pr-head__sub" id="prHeadSub">Empresas que manda Clay para que las prospecten los BDRs.</p>
      </div>
      <div class="pr-head__actions">
      </div>
    </header>

    <div class="pr-denied" id="prDenied" hidden>
      <i class="fa-solid fa-lock"></i>
      <p>You do not have access to Prospecting. It is available to users with the BDR role.</p>
    </div>

    <div id="prApp" hidden>
      <!-- Vistas de la sección elegida en el menú del título: las de empresas
           (prospecting.js → renderTabs) o las de contactos (renderCtTabs). -->
      <div class="pr-tabs pr-viewtabs" role="tablist" id="prTabs">
        <span class="pr-tabs__views" id="prCoStrip">
          <span class="pr-tabs__views" id="prViewTabs"></span>
          <button type="button" class="pr-tab pr-tab--add" id="prViewAdd" title="Create or add a view" aria-label="Create or add a view">
            <i class="fa-solid fa-plus"></i></button>
        </span>
        <span class="pr-tabs__views" id="prCtTabs" hidden></span>
      </div>

      <div class="pr-card" id="prTableCard">
        <div class="pr-filters">
          <label class="pr-filter">
            <span class="pr-filter__label">Prospecting Owner</span>
            <select class="pr-filter__input" id="prFOwner"></select>
          </label>
          <label class="pr-filter">
            <span class="pr-filter__label">Week</span>
            <select class="pr-filter__input" id="prFWeek"></select>
          </label>
          <label class="pr-filter">
            <span class="pr-filter__label">Prospecting Status</span>
            <select class="pr-filter__input" id="prFStatus"></select>
          </label>
          <label class="pr-filter">
            <span class="pr-filter__label">Start date from</span>
            <input type="date" class="pr-filter__input" id="prFStartFrom">
          </label>
          <label class="pr-filter">
            <span class="pr-filter__label">to</span>
            <input type="date" class="pr-filter__input" id="prFStartTo">
          </label>
          <label class="pr-filter pr-filter--wide">
            <span class="pr-filter__label">Search</span>
            <input type="text" class="pr-filter__input pr-filter__input--search" id="prFQ" placeholder="Company or domain…" autocomplete="off">
          </label>
          <label class="pr-check pr-filter-check"><input type="checkbox" id="prFIncomplete"> Contacto incompleto</label>
          <label class="pr-filter" id="prFDummyWrap" hidden>
            <span class="pr-filter__label">Dummy data</span>
            <select class="pr-filter__input" id="prFDummy">
              <option value="exclude">Hide</option>
              <option value="include">Show</option>
              <option value="only">Only dummies</option>
            </select>
          </label>
          <div class="pr-filters__actions">
          <button type="button" class="pr-btn pr-btn--primary" id="prCoNew"><i class="fa-solid fa-plus"></i> Nueva empresa</button>
          <button type="button" class="pr-btn" id="prAdvBtn"><i class="fa-solid fa-sliders"></i> Advanced filters <span class="pr-adv__count" id="prAdvCount"></span></button>
          <button type="button" class="pr-btn" id="prClear"><i class="fa-solid fa-rotate-left"></i> Clear</button>
          <div class="pr-cols">
            <button type="button" class="pr-btn" id="prColsBtn" aria-expanded="false">
              <i class="fa-solid fa-table-columns"></i> Columns <span class="pr-cols__count" id="prColsCount"></span>
            </button>
            <div class="pr-cols__menu" id="prColsMenu" hidden></div>
          </div>
          </div>
        </div>

        <div class="pr-seg-note" id="prSegNote" hidden></div>
        <div class="pr-adv-summary" id="prAdvSummary" hidden></div>
        <div class="pr-viewbar" id="prViewBar" hidden></div>
        <div class="pr-bulk" id="prBulk" hidden></div>
        <div class="pr-table-wrap">
          <table class="pr-table">
            <thead><tr id="prHead"></tr></thead>
            <tbody id="prBody"></tbody>
          </table>
        </div>

        <div class="pr-pager">
          <span class="pr-count" id="prCount"></span>
          <span class="pr-pager__spacer"></span>
          <select class="pr-filter__input pr-pager__size" id="prPageSize">
            <option value="25" selected>25 per page</option>
            <option value="50">50 per page</option>
            <option value="100">100 per page</option>
          </select>
          <button type="button" class="pr-btn" id="prPrev"><i class="fa-solid fa-chevron-left"></i></button>
          <span class="pr-pager__page" id="prPage"></span>
          <button type="button" class="pr-btn" id="prNext"><i class="fa-solid fa-chevron-right"></i></button>
        </div>
      </div>

      <!-- Pestaña Workflows: lista + editor (prospecting-workflows.js) -->
      <!-- Pestaña Contacts -->
      <div class="pr-card" id="prContactsView" hidden>
        <div class="pr-filters">
          <label class="pr-filter pr-filter--wide">
            <span class="pr-filter__label">Search</span>
            <input type="text" class="pr-filter__input pr-filter__input--search" id="prCtQ" placeholder="Name, email or company…" autocomplete="off">
          </label>
          <label class="pr-filter"><span class="pr-filter__label">Lead Life</span><select class="pr-filter__input" id="prCtLead"></select></label>
          <label class="pr-filter"><span class="pr-filter__label">Contact Owner</span><select class="pr-filter__input" id="prCtOwner"></select></label>
          <label class="pr-filter"><span class="pr-filter__label">Company</span>
            <select class="pr-filter__input" id="prCtCompany">
              <option value="">All</option>
              <option value="any">With company</option>
              <option value="none">No company</option>
            </select>
          </label>
          <div class="pr-filters__actions">
            <button type="button" class="pr-btn pr-btn--primary" id="prCtNew"><i class="fa-solid fa-user-plus"></i> New contact</button>
            <button type="button" class="pr-btn" id="prCtAdvBtn"><i class="fa-solid fa-sliders"></i> Advanced filters <span class="pr-adv__count" id="prCtAdvCount"></span></button>
            <button type="button" class="pr-btn" id="prCtColsBtn"><i class="fa-solid fa-table-columns"></i> Columns</button>
          </div>
        </div>

        <div class="pr-seg-note" id="prCtSegNote" hidden></div>
        <div class="pr-adv-summary" id="prCtAdvSummary" hidden></div>
        <div class="pr-viewbar" id="prCtViewBar" hidden></div>
        <div class="pr-bulk" id="prCtBulk" hidden></div>
        <div class="pr-table-wrap">
          <table class="pr-table">
            <thead><tr id="prCtHead"></tr></thead>
            <tbody id="prCtBody"></tbody>
          </table>
        </div>
        <div class="pr-pager">
          <span class="pr-count" id="prCtCount"></span>
          <span class="pr-pager__spacer"></span>
          <button type="button" class="pr-btn" id="prCtPrev"><i class="fa-solid fa-chevron-left"></i></button>
          <span class="pr-pager__page" id="prCtPage"></span>
          <button type="button" class="pr-btn" id="prCtNext"><i class="fa-solid fa-chevron-right"></i></button>
        </div>
      </div>

      <!-- Paneles: métricas de BDRs (prospecting-panels.js) -->
      <div class="pp-view" id="prPanelsView" hidden></div>

      <!-- Negocios: tablero / tabla por pipeline (prospecting-deals.js) -->
      <div class="pr-card pd-view" id="prDealsView" hidden></div>

      <!-- Configuración: sólo owner + editoras de workflows (can_configure en /prospecting/me) -->
      <div class="pr-card pr-settings" id="prSettingsView" hidden>
        <button type="button" class="pr-secitem pr-settings__item" id="prBdrIdsBtn">
          <span class="pr-secitem__icon pr-tone--violet"><i class="fa-solid fa-id-badge"></i></span>
          <span class="pr-secitem__text"><strong>BDR IDs (Clay)</strong>
            <small>Los IDs del Hub de cada BDR, para el round robin de Clay (prospecting_owner_id).</small></span>
          <i class="fa-solid fa-chevron-right pr-settings__go"></i>
        </button>
        <button type="button" class="pr-secitem pr-settings__item" id="prTestBtn">
          <span class="pr-secitem__icon pr-tone--mag"><i class="fa-solid fa-flask"></i></span>
          <span class="pr-secitem__text"><strong>Test panel</strong>
            <small>Crear y borrar empresas dummy, y avanzar el reloj para probar workflows.</small></span>
          <i class="fa-solid fa-chevron-right pr-settings__go"></i>
        </button>
        <button type="button" class="pr-secitem pr-settings__item" id="prDeletedBtn">
          <span class="pr-secitem__icon pr-tone--mag"><i class="fa-solid fa-trash"></i></span>
          <span class="pr-secitem__text"><strong>Registros eliminados</strong>
            <small>Empresas y contactos borrados: Clay y HubSpot no los vuelven a crear. Desde acá se habilitan de nuevo.</small></span>
          <i class="fa-solid fa-chevron-right pr-settings__go"></i>
        </button>
      </div>

      <section class="pr-wf" id="prWorkflows" hidden></section>
    </div>
  </main>

  <div class="pr-pop" id="prViewPop" hidden></div>

  <div class="pr-toast" id="prToast" role="status" aria-live="polite" hidden></div>

  <!-- ============================== Drawer ============================== -->
  <div class="pr-drawer" id="prDrawer" aria-hidden="true">
    <div class="pr-drawer__backdrop" data-drawer-close></div>
    <aside class="pr-drawer__panel" role="dialog" aria-modal="true" aria-labelledby="prDrawerTitle">
      <header class="pr-drawer__head">
        <span class="pr-drawer__eyebrow" id="prDrawerEyebrow">Company</span>
        <h2 class="pr-drawer__title" id="prDrawerTitle">—</h2>
        <p class="pr-drawer__sub" id="prDrawerSub"></p>
        <button type="button" class="pr-drawer__close" data-drawer-close aria-label="Close">&times;</button>
      </header>
      <div class="pr-drawer__body" id="prDrawerBody"></div>
      <footer class="pr-drawer__foot" id="prDrawerFoot">
        <span class="pr-drawer__status" id="prDrawerStatus"></span>
        <button type="button" class="pr-btn pr-btn--primary" id="prDrawerSave">Save</button>
      </footer>
    </aside>
  </div>

  <script src="./assets/js/avatar-map.js" defer></script>
  <script src="./assets/js/sidebar.js?v=20261026-role-access" defer></script>
  <script src="./assets/js/prospecting.js?v=45" defer></script>
  <script src="./assets/js/prospecting-select-search.js?v=1" defer></script>
  <script src="./assets/js/prospecting-workflows.js?v=38" defer></script>
  <script src="./assets/js/prospecting-contacts.js?v=11" defer></script>
  <script src="./assets/js/prospecting-deals.js?v=3" defer></script>
  <script src="./assets/js/prospecting-history.js?v=4" defer></script>
  <script src="./assets/js/prospecting-panels.js?v=5" defer></script>
</body>
</html>

const INDUSTRIES = Object.assign({
  accounting: {
    label: 'Accounting & Finance',
    roles: Object.fromEntries(Object.keys(ROLES).map(k => [k, {label: ROLES[k], d: D[k]}])),
  },
}, EXTRA_INDUSTRIES);

const SW_C = {
  mexico:{name:'Mexico',flag:'🇲🇽'},
  argentina:{name:'Argentina',flag:'🇦🇷'},
  colombia:{name:'Colombia',flag:'🇨🇴'},
  chile:{name:'Chile',flag:'🇨🇱'},
  brazil:{name:'Brazil',flag:'🇧🇷'},
  peru:{name:'Peru',flag:'🇵🇪'},
  uruguay:{name:'Uruguay',flag:'🇺🇾'},
  ecuador:{name:'Ecuador',flag:'🇪🇨'},
  venezuela:{name:'Venezuela',flag:'🇻🇪'},
  bolivia:{name:'Bolivia',flag:'🇧🇴'},
  paraguay:{name:'Paraguay',flag:'🇵🇾'},
};
const SW_SL = {junior:'Junior',semi:'Semi-Senior',senior:'Senior'};

let swI = 'accounting', swR = 'bookkeeper', swC = 'mexico', swS = 'junior';

function currentRole(){ return INDUSTRIES[swI].roles[swR]; }

function getRoleData(country, seniority, type) {
  const r = currentRole().d[country][seniority];
  const o = {monthly:0, hourly:5, yearly:10}[type];
  return { low:r[o], mid:r[o+1], high:r[o+2], usaMid:r[o+3], annualSavings:r[o+4] };
}

function swFmt(v, t) {
  if(t==='hourly') return '$'+v.toFixed(2)+'/hr';
  if(t==='yearly') return '$'+(v>=1000?(v/1000).toFixed(0)+'K':v);
  return '$'+Math.round(v).toLocaleString('en-US');
}
function swPct(l,u){return Math.round((1-l/u)*100);}

function buildIndustries(){
  const row = document.getElementById('sw-industries');
  row.innerHTML = '<span class="sw-clbl">Industry</span>' + Object.keys(INDUSTRIES).map(k =>
    `<button type="button" class="sw-ipill${k===swI?' sw-on':''}" role="tab" aria-selected="${k===swI}" data-ind="${k}">${INDUSTRIES[k].label}</button>`
  ).join('');
}

function buildRoles(){
  const sel = document.getElementById('sw-role');
  const roles = INDUSTRIES[swI].roles;
  sel.innerHTML = Object.keys(roles).map(k => `<option value="${k}">${roles[k].label.replace(/&/g,'&amp;')}</option>`).join('');
  if(!roles[swR]) swR = Object.keys(roles)[0];
  sel.value = swR;
}

// Accounting trae 8 países y el resto 11: las pills salen del rol elegido.
function buildCountries(){
  const avail = Object.keys(SW_C).filter(c => currentRole().d[c]);
  if(!avail.includes(swC)) swC = avail[0];
  document.getElementById('sw-countries').innerHTML = '<span class="sw-clbl">Country</span>' + avail.map(c =>
    `<button type="button" class="sw-cpill${c===swC?' sw-on':''}" data-country="${c}">${SW_C[c].flag} ${SW_C[c].name}</button>`
  ).join('');
}

function swRender(){
  const t = document.getElementById('sw-type').value;
  const d = getRoleData(swC, swS, t);
  const sv = swPct(d.mid, d.usaMid);
  const MAX = 148;
  const lH = Math.max(Math.round(d.mid/d.usaMid*MAX), 8);
  const uH = MAX;

  document.getElementById('sw-leg').textContent = SW_C[swC].name;
  document.getElementById('sw-ct-sen').textContent = SW_SL[swS];
  document.getElementById('sw-ct-role').textContent = currentRole().label;
  document.getElementById('sw-ct-country').textContent = SW_C[swC].name;
  document.getElementById('sw-ct-saving').textContent = '$'+Math.round(d.annualSavings/1000)+'K';

  const area = document.getElementById('sw-bars');
  area.style.height = (MAX+67)+'px';
  area.innerHTML = `
    <div class="sw-bar-col">
      <div class="sw-bar-wrap" style="height:${MAX+54}px">
        <div class="sw-save-badge">Save ${sv}%</div>
        <div class="sw-bar sw-latam" style="height:${lH}px;width:78%">${lH>36?`<span class="sw-bar-val">${swFmt(d.mid,t)}</span>`:''}</div>
      </div>
      <div class="sw-bar-name sw-ln">${SW_C[swC].flag} ${SW_C[swC].name}</div>
    </div>
    <div class="sw-bar-col">
      <div class="sw-bar-wrap" style="height:${MAX+44}px">
        <div style="height:44px;flex-shrink:0"></div>
        <div class="sw-bar sw-usa" style="height:${uH}px;width:78%"><span class="sw-bar-val">${swFmt(d.usaMid,t)}</span></div>
      </div>
      <div class="sw-bar-name sw-un">🇺🇸 USA</div>
    </div>`;
  postHeight();
}

function renderAll(){ buildIndustries(); buildRoles(); buildCountries(); swRender(); }

// Webflow: el iframe no sabe su alto; se lo avisamos al padre en cada cambio.
function postHeight(){
  if(window.parent === window) return;
  const h = Math.ceil(document.documentElement.getBoundingClientRect().height);
  window.parent.postMessage({type:'vintti-salary-widget', height:h}, '*');
}

document.getElementById('sw-industries').addEventListener('click', e => {
  const b = e.target.closest('[data-ind]'); if(!b) return;
  swI = b.dataset.ind; renderAll();
});
document.getElementById('sw-role').addEventListener('change', e => {
  swR = e.target.value; buildCountries(); swRender();
});
document.getElementById('sw-type').addEventListener('change', swRender);
document.getElementById('sw-countries').addEventListener('click', e => {
  const b = e.target.closest('[data-country]'); if(!b) return;
  swC = b.dataset.country; buildCountries(); swRender();
});
document.querySelector('.sw-tabs').addEventListener('click', e => {
  const b = e.target.closest('[data-sen]'); if(!b) return;
  swS = b.dataset.sen;
  document.querySelectorAll('.sw-stab').forEach(x => x.classList.toggle('sw-on', x === b));
  swRender();
});
window.addEventListener('resize', postHeight);
window.addEventListener('load', postHeight);
if(window.ResizeObserver) new ResizeObserver(postHeight).observe(document.body);

// ?industry=marketing&role=sdr&country=peru → para fijar el arranque desde Webflow.
(function applyUrlParams(){
  const p = new URLSearchParams(location.search);
  const ind = p.get('industry'), role = p.get('role'), c = p.get('country');
  if(ind && INDUSTRIES[ind]) { swI = ind; swR = Object.keys(INDUSTRIES[ind].roles)[0]; }
  if(role && INDUSTRIES[swI].roles[role]) swR = role;
  if(c && SW_C[c]) swC = c;
})();
renderAll();
</script>
